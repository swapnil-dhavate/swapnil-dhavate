6" y="124" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >tester can check. Prioritise</text><text x="263.6" y="144" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >with MoSCoW.</text><line x1="263.6" y1="174" x2="449.2" y2="174" stroke="#25304F"/><text x="263.6" y="196" font-size="10.5" font-weight="700" fill="#60A5FA" text-anchor="start" class="mono" letter-spacing="1.5">OUTPUT</text><text x="263.6" y="218" font-size="12.5" font-weight="600" fill="#E8ECF4" text-anchor="start" >BRD · FRD · user stories +</text><text x="263.6" y="236" font-size="12.5" font-weight="600" fill="#E8ECF4" text-anchor="start" >AC</text></g><circle cx="478.2" cy="38" r="9" fill="#0B1020" stroke="#25304F"/><path d="M475.7 34 l4 4 l-4 4" stroke="#A3AEC2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fade" style="animation-delay:0.24s"><rect x="487.7" y="0.5" width="224.6" height="255" rx="18" fill="url(#gCard)" stroke="#25304F"/><circle cx="523.2" cy="38" r="16" fill="#A78BFA" opacity=".16"/><text x="523.2" y="44" font-size="16" font-weight="800" fill="#A78BFA" text-anchor="middle" >3</text><text x="549.2" y="44" font-size="19" font-weight="800" fill="#E8ECF4" text-anchor="start" >Design</text><text x="507.2" y="84" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >Put a clickable prototype in</text><text x="507.2" y="104" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >front of SMEs early, so</text><text x="507.2" y="124" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >wrong ideas fail in review,</text><text x="507.2" y="144" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >not UAT.</text><line x1="507.2" y1="174" x2="692.8" y2="174" stroke="#25304F"/><text x="507.2" y="196" font-size="10.5" font-weight="700" fill="#A78BFA" text-anchor="start" class="mono" letter-spacing="1.5">OUTPUT</text><text x="507.2" y="218" font-size="12.5" font-weight="600" fill="#E8ECF4" text-anchor="start" >Figma · HTML mock-ups ·</text><text x="507.2" y="236" font-size="12.5" font-weight="600" fill="#E8ECF4" text-anchor="start" >UML</text></g><circle cx="721.8" cy="38" r="9" fill="#0B1020" stroke="#25304F"/><path d="M719.3 34 l4 4 l-4 4" stroke="#A3AEC2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fade" style="animation-delay:0.36s"><rect x="731.3" y="0.5" width="224.6" height="255" rx="18" fill="url(#gCard)" stroke="#25304F"/><circle cx="766.8" cy="38" r="16" fill="#F472B6" opacity=".16"/><text x="766.8" y="44" font-size="16" font-weight="800" fill="#F472B6" text-anchor="middle" >4</text><text x="792.8" y="44" font-size="19" font-weight="800" fill="#E8ECF4" text-anchor="start" >Deliver</text><text x="750.8" y="84" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >Run sprint ceremonies,</text><text x="750.8" y="104" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >triage bugs in Jira, keep</text><text x="750.8" y="124" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >stakeholders aligned on</text><text x="750.8" y="144" font-size="13.5" font-weight="400" fill="#A3AEC2" text-anchor="start" >scope and dates.</text><line x1="750.8" y1="174" x2="936.4" y2="174" stroke="#25304F"/><text x="750.8" y="196" font-size="10.5" font-weight="700" fill="#F472B6" text-anchor="start" class="mono" letter-spacing="1.5">OUTPUT</text><text x="750.8" y="218" font-size="12.5" font-weight="600" fill="#E8ECF4" text-anchor="start" >Backlog · sprints · PO</text><text x="750.8" y="236" font-size="12.5" font-weight="600" fill="#E8ECF4" text-anchor="start" >sign-off</text></g><circle cx="965.4" cy="38" r="9" fill="#0B1020" stroke="#25304F"/><path d="M962.9 34 l4 4 l-4 4" stroke="#A3AEC2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fade" style="animation-delay:0.48s"><rect x="9